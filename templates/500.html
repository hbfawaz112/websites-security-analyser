{% extends "layout.html" %}

{% block title %}Server Error - Security Checker{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-content">
        <div class="error-icon">
            <i class="fas fa-server"></i>
        </div>
        <h1 class="error-title">500 - Server Error</h1>
        <p class="error-message">
            Something went wrong on our end. We're working to fix this issue.
        </p>
        <div class="error-details">
            <p class="error-suggestion">
                <i class="fas fa-lightbulb"></i>
                Try refreshing the page or scanning a different website.
            </p>
        </div>
        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                <i class="fas fa-home"></i>
                Back to Security Checker
            </a>
            <button onclick="window.location.reload()" class="btn btn-secondary">
                <i class="fas fa-refresh"></i>
                Try Again
            </button>
        </div>
    </div>
</div>

<style>
.error-page {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
}

.error-content {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 3rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    max-width: 500px;
}

.error-icon {
    font-size: 4rem;
    color: #dc3545;
    margin-bottom: 1.5rem;
}

.error-title {
    font-size: 2rem;
    color: #333;
    margin-bottom: 1rem;
}

.error-message {
    color: #666;
    font-size: 1.1rem;
    line-height: 1.6;
    margin-bottom: 1.5rem;
}

.error-details {
    background: #f8f9fa;
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 2rem;
}

.error-suggestion {
    color: #495057;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}

.error-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}
</style>
{% endblock %}
